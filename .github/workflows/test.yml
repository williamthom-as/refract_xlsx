name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test against refract_core and refract_duckdb main
    runs-on: ubuntu-latest
    env:
      REFRACT_PATH: ../refract
      REFRACT_DUCKDB_PATH: ../refract_duckdb
    defaults:
      run:
        working-directory: refract_xlsx

    steps:
    - uses: actions/checkout@v4
      with:
        path: refract_xlsx
    - name: Check out refract core beside the plugin
      uses: actions/checkout@v4
      with:
        repository: williamthom-as/refract_core
        ref: main
        path: refract
    - name: Check out refract_duckdb beside the plugin (a test only dep)
      uses: actions/checkout@v4
      with:
        repository: williamthom-as/refract_duckdb
        ref: main
        path: refract_duckdb
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20.2'
        otp-version: '28.5'
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: refract_xlsx/deps
        key: ${{ runner.os }}-mix-${{ hashFiles('refract_xlsx/mix.lock', 'refract/mix.lock', 'refract_duckdb/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Compile code
      run: mix compile --warnings-as-errors
    - name: Check formatting
      run: mix format --check-formatted
    - name: Credo
      run: mix credo --strict
    - name: Run tests
      run: mix test
      env:
        MIX_ENV: test

    # dialyzer last since its slowest
    - name: Restore PLT cache
      uses: actions/cache@v4
      with:
        path: refract_xlsx/priv/plts
        key: ${{ runner.os }}-plt-otp28.5-elixir1.20.2-${{ hashFiles('refract_xlsx/mix.lock', 'refract_xlsx/mix.exs', 'refract/mix.lock', 'refract_duckdb/mix.lock', 'refract/lib/**/*.ex') }}
    - name: Build PLT
      run: mix dialyzer --plt
    - name: Dialyzer
      run: mix dialyzer --force-check --format short
